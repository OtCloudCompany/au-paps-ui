<a [routerLink]="(bitstreamPath$| async)?.routerLink" class="dont-break-out p-0"
   [queryParams]="(bitstreamPath$| async)?.queryParams"
   [target]="isBlank ? '_blank': '_self'"
   [ngClass]="cssClasses"
   [attr.aria-label]="('file-download-link.download' | translate) + dsoNameService.getName(bitstream)">
  <span role="img" *ngIf="(canDownload$ |async) !== true"
        [attr.aria-label]="'file-download-link.restricted' | translate" class="pr-1">
    <i class="fas fa-lock"></i>
  </span>
  <span role="img" *ngIf="(canDownload$ |async) === true" class="pr-1">
    <i class="fas fa-cloud-download text-au-red"></i>
  </span>
  <ng-container *ngTemplateOutlet="content"></ng-container>
</a>

<ng-template #content>
  <ng-content></ng-content>
</ng-template>
