<ds-home-coar></ds-home-coar>
<ds-home-news></ds-home-news>
<div class="container-fluid px-0">
  <ng-container searchContentTop *ngTemplateOutlet="homeContent"></ng-container>
</div>

<ds-suggestions-popup></ds-suggestions-popup>

<ng-template #homeContent>
  <ng-container *ngIf="(site$ | async) as site">
    <ds-view-tracker [object]="site"></ds-view-tracker>
  </ng-container>
  <div class="container-fluid bg-light py-4 mb-4">
    <div class="container top-level-communities">
      <ds-top-level-community-list></ds-top-level-community-list>
    </div>
  </div>
  <div class="container-fluid">
    <div class="container">
      <div class="row border-top-danger">
        <div class="col-md-8 col-sm-12">
          <ds-recent-item-list *ngIf="recentSubmissionspageSize > 0"></ds-recent-item-list>
        </div>
        <div class="col-md-4 col-sm-12">
          <div class="card mb-4">
            <div class="card-body">
              <h2 class="text-center mb-0">{{ "customSidebar.head" | translate }}</h2>
              <div class="d-flex flex-row border-bottom mb-4 pb-4"></div>
              <ds-custom-sidebar></ds-custom-sidebar>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h4 class="card-title mb-0">{{ "customSidebar.calendar.head" | translate }}</h4>
            </div>
            <div class="card-body p-0">
              <iframe
                src="https://calendar.google.com/calendar/embed?height=600&wkst=2&bgcolor=%23ffffff&ctz=Africa%2FNairobi&mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0&src=dHU4NjVkcnFnbTYxam1vcjRmc2F0azgyaThAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&color=%237CB342"
                style="border:0; width:100%; height:600px;"
                frameborder="0" scrolling="no">
              </iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
