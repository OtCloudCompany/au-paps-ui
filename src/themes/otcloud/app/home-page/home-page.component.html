<ds-home-coar></ds-home-coar>
<ds-home-news></ds-home-news>
<div class="container-fluid px-0">
  <ng-container searchContentTop *ngTemplateOutlet="homeContent"></ng-container>
</div>

<ds-suggestions-popup></ds-suggestions-popup>

<ng-template #homeContent>
  <ng-container *ngIf="(site$ | async) as site">
    <ds-view-tracker [object]="site"></ds-view-tracker>
  </ng-container>
  <div class="container-fluid bg-light py-4 mb-4">
    <div class="container top-level-communities">
      <ds-top-level-community-list></ds-top-level-community-list>
    </div>
  </div>
  <div class="container-fluid">
    <div class="container">
      <div class="row border-top-danger">
        <div class="col-md-8 col-sm-12">
          <ds-recent-item-list *ngIf="recentSubmissionspageSize > 0"></ds-recent-item-list>
        </div>
        <div class="col-md-4 col-sm-12 bg-light pt-3">
          <div class="card mb-4">
            <div class="card-body">
              <ds-custom-sidebar></ds-custom-sidebar>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h4 class="card-title mb-0">Events Calendar</h4>
            </div>
            <div class="card-body p-0">
              <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=Africa%2FNairobi&title=PSC%20Calendar&mode=AGENDA&showTabs=0&showPrint=0&showNav=0&showTitle=0&showCalendars=0&src=ZW4tZ2Iua2UjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%230B8043"
                      width="100%" height="600" frameborder="0" scrolling="yes"></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
